# Rate-limiting reverse proxy for the justice servers (dev-only sidecar).
#
# All upstreams share one physical server, so a single global bucket paces
# every request to 1 r/s regardless of which API it targets. Requests over
# the rate are queued (delayed), not rejected - only a queue overflowing
# `burst` gets an immediate 429 (distinguishable from upstream errors).
#
# Usage: curl http://localhost:8090/<service>/<path> - the prefix is
# stripped and the rest is proxied to https://<service>.gov.cz/<path>.
# Queued requests can wait up to <queue position> seconds, so give clients
# a generous timeout (e.g. curl --max-time 180).

limit_req_zone "justice" zone=justice:1m rate=1r/s;

log_format ratelimit '$time_iso8601 $limit_req_status $status $request_time "$request"';

server {
    listen 80;

    limit_req zone=justice burst=120;
    limit_req_status 429;

    access_log /var/log/nginx/access.log ratelimit;

    location /infosoud/ {
        proxy_pass https://infosoud.gov.cz/;
        proxy_ssl_server_name on;
        proxy_set_header Host infosoud.gov.cz;
        proxy_set_header User-Agent "Lexion (https://lex.ion.cz)";
        proxy_redirect https://infosoud.gov.cz/ /infosoud/;
    }

    location /infojednani/ {
        proxy_pass https://infojednani.gov.cz/;
        proxy_ssl_server_name on;
        proxy_set_header Host infojednani.gov.cz;
        proxy_set_header User-Agent "Lexion (https://lex.ion.cz)";
        proxy_redirect https://infojednani.gov.cz/ /infojednani/;
    }

    location /infodeska/ {
        proxy_pass https://infodeska.gov.cz/;
        proxy_ssl_server_name on;
        proxy_set_header Host infodeska.gov.cz;
        proxy_set_header User-Agent "Lexion (https://lex.ion.cz)";
        proxy_redirect https://infodeska.gov.cz/ /infodeska/;
    }

    location /msp/ {
        proxy_pass https://msp.gov.cz/;
        proxy_ssl_server_name on;
        proxy_set_header Host msp.gov.cz;
        proxy_set_header User-Agent "Lexion (https://lex.ion.cz)";
        proxy_redirect https://msp.gov.cz/ /msp/;
    }
}
