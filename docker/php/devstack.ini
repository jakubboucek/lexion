; Dev-only PHP overrides for the devstack container (mounted into conf.d).
;
; The System > Import page takes a whole sync export part through an HTTP
; upload, and the stock 2M/8M limits are below even a compressed part. These
; limits are ours to set locally; on the hosting they are not, so export parts
; still have to be small enough to fit whatever production allows.
upload_max_filesize = 128M
post_max_size = 128M
