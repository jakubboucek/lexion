services:
    web:
        image: jakubboucek/lamp-devstack-php:8.5
        environment:
            APACHE_DOCUMENT_ROOT: "/var/www/html/web/www"
            APP_DEBUG: 1
            TZ: Europe/Prague
        ports:
            - "127.0.0.1:8080:80"
        restart: always
        volumes:
            - ".:/var/www/html"
            # Raises the upload limits for the sync import (see docker/php/devstack.ini).
            - "./docker/php/devstack.ini:/usr/local/etc/php/conf.d/zz-devstack.ini:ro"

    mysqldb:
        image: jakubboucek/lamp-devstack-mysql:10.5
        environment:
            MARIADB_DATABASE: default
            MARIADB_ROOT_PASSWORD: devstack
            TZ: Europe/Prague
        ports:
            - "127.0.0.1:33060:3306"
        restart: always
        volumes:
            - "./.docker/mysql/data:/var/lib/mysql"

    # Document mining toolset (PDF, OCR, Office formats). Not part of the running
    # stack - the profile keeps it out of `docker compose up`; use `bin/pdf`.
    pdftools:
        build: docker/pdftools
        image: jakubboucek/pdftools
        profiles:
            - tools
        environment:
            TZ: Europe/Prague
        volumes:
            - ".:/work"
        working_dir: /work

    adminer:
        image: adminer
        environment:
            ADMINER_DEFAULT_SERVER: mysqldb
            ADMINER_DESIGN: hever
            ADMINER_PLUGINS: edit-foreign backward-keys sql-gemini
        ports:
            - "127.0.0.1:8088:8080"
        restart: always
